<svg width="488" height="680" viewBox="0 0 488 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="488" height="680" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="24" y="24" width="440" height="632" rx="8" fill="#E5E7EB"/>
  
  <!-- Card frame -->
  <rect x="40" y="40" width="408" height="600" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  
  <!-- Title area -->
  <rect x="60" y="60" width="368" height="40" rx="4" fill="#F9FAFB"/>
  <rect x="80" y="75" width="200" height="10" rx="5" fill="#D1D5DB"/>
  
  <!-- Mana cost area -->
  <circle cx="380" cy="80" r="15" fill="#E5E7EB" stroke="#9CA3AF"/>
  <circle cx="410" cy="80" r="15" fill="#E5E7EB" stroke="#9CA3AF"/>
  
  <!-- Art area -->
  <rect x="60" y="120" width="368" height="260" rx="4" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="244" y="260" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="16">Card Image</text>
  
  <!-- Type line -->
  <rect x="60" y="400" width="368" height="30" rx="4" fill="#F9FAFB"/>
  <rect x="80" y="410" width="150" height="10" rx="5" fill="#D1D5DB"/>
  
  <!-- Text box -->
  <rect x="60" y="450" width="368" height="120" rx="4" fill="#FEFEFE" stroke="#E5E7EB"/>
  <rect x="80" y="470" width="280" height="8" rx="4" fill="#F3F4F6"/>
  <rect x="80" y="490" width="320" height="8" rx="4" fill="#F3F4F6"/>
  <rect x="80" y="510" width="250" height="8" rx="4" fill="#F3F4F6"/>
  
  <!-- P/T box (for creatures) -->
  <rect x="360" y="580" width="68" height="40" rx="4" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="394" y="605" text-anchor="middle" fill="#9CA3AF" font-family="sans-serif" font-size="14">*/*</text>
</svg>
