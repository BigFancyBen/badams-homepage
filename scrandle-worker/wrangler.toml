name = "scrandle"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Hourly on the hour: ingest, close what is due, post what is due — one tick.
# The second entry adds a tick at :11 so the person bonus can fire at 11:11am;
# every other post is gated to :00 and ignores it. Keep both broad and UTC —
# DST is handled by shifting the *_HOUR_UTC vars, never the cron.
[triggers]
crons = ["0 * * * *", "11 * * * *"]

[vars]
DISCORD_CHANNEL_ID = "1290910290086592563"   # the food channel
DISCORD_GUILD_ID = "108689961535934464"      # the server
TASTER_ROLE_ID = ""              # optional; leave empty to skip pings
IMAGE_BASE_URL = "https://www.benadams.dev"   # apex 308-redirects to www; avoid the hop
R2_PUBLIC_BASE = "https://pub-b7525558c8974aa0aa1f10bf9856eb18.r2.dev"

# Fallback window, used only when POST_HOURS_UTC is empty. On a fixed
# schedule a matchup closes when the next one is due, so this is unused.
VOTE_WINDOW_HOURS = "12"
# 15:00 and 03:00 UTC = 9am and 9pm Mountain *while MDT is in effect*.
# Cloudflare crons do not follow DST — shift both to 16 and 04 in November.
# These two slots are cooking and nothing else; drinks have their own, below.
POST_HOURS_UTC = "15,3"
# Weekly standings post: 0 = Sunday. Set to -1 to disable.
STANDINGS_WEEKDAY = "0"
STANDINGS_HOUR_UTC = "17"

# The weekly place round: five places on one card, ranked best-first, posted
# alongside the ordinary matchup rather than in place of it. Comma-separated
# weekdays, 1 = Monday; set PLACE_WEEKDAY to -1 (or empty) to disable. 18:00
# UTC = noon Mountain *while MDT is in effect* — shift to 19 in November, same
# as POST_HOURS_UTC above. Places are drawn nowhere else.
#
# Once a week rather than the twice it ran as a pair: a round eats five
# photographs instead of two, and one good ranking is worth more than two coin
# tosses between holiday snaps.
PLACE_WEEKDAY = "1"
PLACE_HOUR_UTC = "18"
# Flat window: the round is outside the food cadence, so it does not close on
# a posting hour. A full day means noon to noon.
PLACE_WINDOW_HOURS = "24"
# Five is the most buttons Discord will put in one action row, and about the
# most photographs that stay legible on a phone. Three is the floor below which
# the round refuses to post.
PLACE_BALLOT_SIZE = "5"

# The weekly themed fives: five of one kind of plate on Wednesday, five of
# one kind of drink on Friday. Same machinery as the place round above — its
# own day, its own hour, a flat window, posted alongside whatever is open.
#
# What is different is the draw. A five drawn from food at large is a lasagne
# against a fry-up against a cheeseboard, and what people rank there is which
# meal they fancy rather than which plate is better. So the round is built
# around one kind — five pastas, five steaks, five burgers — using the kind the
# classifier writes beside the category. When no kind can fill a card the round
# falls back to a mixed five rather than skipping the week.
#
# 3 = Wednesday, 18:00 UTC = noon Mountain while MDT is in effect (shift to 19
# in November with the rest). Clear of the Monday place round, the Tuesday
# person bonus and both cooking slots. Set FOOD_ROUND_WEEKDAY to -1 to disable.
FOOD_ROUND_WEEKDAY = "3"
FOOD_ROUND_HOUR_UTC = "18"
FOOD_ROUND_WINDOW_HOURS = "24"
FOOD_ROUND_BALLOT_SIZE = "5"

# 5 = Friday, 22:00 UTC = 4pm Mountain while MDT is in effect (shift to 23 in
# November). An hour before the happy-hour drink matchup rather than on top of
# it: the two share a pool, and a round and a pair landing in the same minute
# reads as one post that went out twice.
DRINK_ROUND_WEEKDAY = "5"
DRINK_ROUND_HOUR_UTC = "22"
DRINK_ROUND_WINDOW_HOURS = "24"
DRINK_ROUND_BALLOT_SIZE = "5"

# Person-vs-person bonus, same machinery as the place bonus. 2 = Tuesday, at
# 11:11am Mountain — 17:11 UTC while MDT is in effect (shift to 18 in November).
# The :11 needs the minute-11 cron above. Set PERSON_WEEKDAY to -1 to disable.
PERSON_WEEKDAY = "2"
PERSON_HOUR_UTC = "17"
PERSON_MINUTE = "11"
PERSON_WINDOW_HOURS = "24"

# Drink vs drink, on a slot of its own so the 9am and 9pm posts are always
# cooking. 23:00 UTC = 5pm Mountain *while MDT is in effect* — shift to 00 in
# November, same as the hours above. Happy hour, and clear of every other slot.
#
# "auto" sets the days from the size of the drink catalog, aiming to put every
# drink on the board about once a month — roughly one post a week per eight
# drinks, from weekly at the bottom to daily at the top. See drinkCadence in
# schedule.ts. A comma-separated list overrides it (0 = Sunday); -1 turns the
# slot off entirely.
DRINK_WEEKDAY = "auto"
DRINK_HOUR_UTC = "23"
# 22 rather than 24 so a daily cadence closes the previous drink matchup two
# hours before the next one goes up, instead of exactly on top of it — a late
# or missed tick would otherwise leave two live at once.
DRINK_WINDOW_HOURS = "22"

# The caption contest: one photograph, everybody writes a line, then everybody
# ranks the lines. Two phases of a day each. 6 = Saturday, 16:00 UTC = 10am
# Mountain *while MDT is in effect* — shift to 17 in November with the rest.
#
# Saturday 10am opens the writing, Sunday 10am opens the vote, Monday 10am
# gives the result — two hours before the Monday place round and a day clear
# of the Sunday standings post. Set CAPTION_WEEKDAY to -1 (or empty) to
# disable. It draws only the categories nothing else has a question for:
# ingredient, pet, document, screenshot, other.
CAPTION_WEEKDAY = "6"
CAPTION_HOUR_UTC = "16"
CAPTION_WRITING_HOURS = "24"
CAPTION_VOTING_HOURS = "24"

[[d1_databases]]
binding = "DB"
database_name = "scrandle"
database_id = "ff3e323f-1330-4b56-88d3-3905dae1c1f7"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "scrandle-images"

# Secrets (wrangler secret put <NAME>), never in this file:
#   DISCORD_BOT_TOKEN
#   DISCORD_PUBLIC_KEY
#   DISCORD_LOG_WEBHOOK_URL      (optional)
#   SCRANDLE_IMAGE_SECRET
#   BACKFILL_SECRET
